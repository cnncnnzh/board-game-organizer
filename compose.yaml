services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: boardgame
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: boardgame
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardgame -d boardgame"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://boardgame:${POSTGRES_PASSWORD:-local-development-only}@db:5432/boardgame
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      ENABLE_TEST_TOOLS: ${ENABLE_TEST_TOOLS:-false}
    depends_on:
      db:
        condition: service_healthy
    init: true
volumes:
  postgres-data:
